name: Links static contract
'on':
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: links-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record runner and source identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python3 --version
          uname -a
      - name: Validate changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Verify publication baseline and reviewed candidate delta
        run: python3 .github/ci/verify-published-source.py
      - name: Validate existing static Links contract
        run: python3 .github/ci/static-contract.py
      - name: Validate Netlify hosting and package parity
        run: python3 .github/ci/netlify-contract.py "$RUNNER_TEMP/links-static" > "$RUNNER_TEMP/links-static-manifest.json"
      - name: Record static package identity in free job logs
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          cat "$RUNNER_TEMP/links-static-manifest.json"
          sha256sum "$RUNNER_TEMP/links-static"/*
          echo "No Actions artifact or cache upload; exact static package and source guards remain mandatory."
