<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#F5F3EE;
  color:#0A0A0A;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a:focus-visible,button:focus-visible{outline:2px solid #0A0A0A;outline-offset:3px}

/* ─────────────────────────────────────
   STAMP layout — Direction B
   ───────────────────────────────────── */
.page{display:none;width:100%;min-height:100vh;animation:fadein .25s cubic-bezier(.4,0,.2,1)}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sb-root{
  --bg:#F5F3EE;
  --ink:#0A0A0A;
  --ink-2:#595550;
  --ink-3:#9B958C;
  --line:rgba(10,10,10,.85);
  background:var(--bg);
  color:var(--ink);
  width:100%;
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  box-shadow:0 0 0 1px rgba(10,10,10,.06);
}

/* Top band */
.sb-band{
  background:var(--ink);
  color:var(--bg);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.sb-pad{padding:0 24px 32px}

/* Hero (holding) */
.sb-hero{padding:36px 0 20px}
.sb-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);
  display:flex;justify-content:space-between;
  margin-bottom:18px;
}
.sb-name{
  font-family:'Anton','Bebas Neue','Inter Tight',sans-serif;
  font-weight:400;
  font-size:88px;line-height:.82;
  letter-spacing:-.02em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.sb-name .sb-slash{color:var(--ink-3)}
.sb-tag{
  font-size:14px;line-height:1.5;
  color:var(--ink);max-width:280px;
  border-left:3px solid var(--ink);
  padding-left:12px;
}

/* Section heading */
.sb-section{
  margin:30px 0 12px;
  display:flex;align-items:center;gap:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);
}
.sb-section .sb-num{
  background:var(--ink);color:var(--bg);
  padding:3px 7px;font-weight:700;
}
.sb-section .sb-rule{flex:1;height:2px;background:var(--ink)}

/* Product card */
.sb-prod{
  display:block;text-decoration:none;
  padding:22px 22px 20px;
  margin-bottom:14px;
  border:2.5px solid var(--ink);
  position:relative;
  box-shadow:5px 5px 0 var(--ink);
  transition:transform .15s,box-shadow .15s;
}
.sb-prod:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.sb-prod:active{transform:translate(0,0);box-shadow:3px 3px 0 var(--ink)}
.sb-prod-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sb-prod-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  background:var(--ink);color:var(--c);
  padding:4px 8px;
}
.sb-prod-mark{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:22px;line-height:1;
}
.sb-prod-name{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:38px;line-height:.9;
  text-transform:uppercase;
  letter-spacing:-.01em;
  margin-bottom:8px;
}
.sb-prod-sub{font-size:12.5px;line-height:1.4;opacity:.85;margin-bottom:14px}
.sb-prod-foot{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border-top:1.5px dashed currentColor;
  padding-top:10px;
  opacity:.8;
}

/* URL pill */
.sb-url{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 18px;
  background:var(--ink);color:var(--bg);
  text-decoration:none;
  margin-bottom:10px;
  border:2px solid var(--ink);
  transition:transform .12s;
}
.sb-url:hover{transform:translateY(-1px)}
.sb-url:active{transform:translateY(0)}
.sb-url-name{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:24px;line-height:1;text-transform:uppercase;
  letter-spacing:.01em;
}
.sb-url-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.12em;
  opacity:.55;margin-top:4px;
}

/* Social grid */
.sb-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border:2px solid var(--ink);
  background:var(--ink);
}
.sb-tile{
  background:var(--bg);
  color:var(--ink);
  display:flex;align-items:center;gap:12px;
  padding:14px 14px;
  min-height:64px;
  text-decoration:none;
  transition:background .15s,color .15s;
  position:relative;
  border:1px solid var(--ink);
  margin:-1px;
}
.sb-tile:hover{background:var(--ink);color:var(--bg)}
.sb-tile.soon{
  background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 8px,rgba(10,10,10,.04) 8px,rgba(10,10,10,.04) 16px);
  color:var(--ink-3);
  cursor:not-allowed;
  pointer-events:none;
}
.sb-tile.soon:hover{background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 8px,rgba(10,10,10,.04) 8px,rgba(10,10,10,.04) 16px);color:var(--ink-3)}
.sb-tile-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:18px;height:18px}
.sb-tile-text{display:flex;flex-direction:column;min-width:0;flex:1}
.sb-tile-name{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:18px;line-height:1;
  letter-spacing:.01em;
  text-transform:uppercase;
}
.sb-tile-handle{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:.06em;
  margin-top:5px;
  opacity:.65;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sb-tile.soon .sb-tile-handle{opacity:1;font-weight:600}

/* Stats */
.sb-stats{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.sb-stat{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.1em;
  padding:5px 9px;
  background:var(--ink);color:var(--bg);
}
.sb-stat.sb-stat-line{
  background:transparent;color:var(--ink);
  border:1.5px solid var(--ink);
}

/* Bottom band */
.sb-foot{
  background:var(--ink);color:var(--bg);
  padding:12px 24px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
}
.sb-foot a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;opacity:.7}
.sb-foot a:hover{opacity:1}

/* Brand page extras */
.sb-back{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;
  border:1.5px solid var(--ink);
  padding:7px 12px;
  margin-bottom:24px;
  white-space:nowrap;
  transition:background .15s,color .15s;
  cursor:pointer;
}
.sb-back:hover{background:var(--ink);color:var(--bg)}

.sb-brandhero{padding:28px 0 22px;position:relative;display:flex;flex-direction:column;align-items:flex-start}
.sb-mark{
  display:inline-block;
  padding:8px 14px;
  margin-bottom:16px;
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:22px;
  line-height:1.05;
  background:var(--accent);
  color:var(--ink);
  border:2px solid var(--ink);
  white-space:nowrap;
}

.sb-plat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-platbtn{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border:2px solid var(--ink);
  text-decoration:none;color:var(--ink);
  background:var(--bg);
  transition:background .15s,color .15s;
}
.sb-platbtn:hover{background:var(--ink);color:var(--bg)}
.sb-platbtn.soon{
  background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 8px,rgba(10,10,10,.04) 8px,rgba(10,10,10,.04) 16px);
  color:var(--ink-3);
  cursor:not-allowed;
  pointer-events:none;
}
.sb-platbtn-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:18px;height:18px}
.sb-platbtn-text{display:flex;flex-direction:column}
.sb-platbtn-n{font-family:'Anton','Bebas Neue',sans-serif;font-size:16px;text-transform:uppercase;line-height:1}
.sb-platbtn-s{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;margin-top:3px;color:var(--ink-2)}
.sb-platbtn.soon .sb-platbtn-s{color:var(--ink-3);font-weight:600}

.sb-legal{
  margin-top:16px;padding:12px 14px;
  border:1.5px solid var(--ink);background:transparent;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;line-height:1.5;letter-spacing:.05em;
  color:var(--ink);
}
.sb-legal a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.sb-legal .sb-legal-2{opacity:.55;display:block;margin-top:4px}

/* Soon tag for brand product cards (LifeOS) */
.sb-prod-soon{
  position:absolute;top:0;right:22px;
  transform:translateY(-50%);
  background:var(--ink);color:var(--c);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  padding:4px 8px;
  font-weight:700;
}

/* Responsive — smaller on tiny phones */
@media (max-width:380px){
  .sb-name{font-size:72px}
  .sb-prod-name{font-size:32px}
  .sb-tile{padding:12px 10px;min-height:56px}
  .sb-tile-name{font-size:16px}
}

/* Print */
@media print{
  body{background:#fff}
  .page{display:block!important;page-break-after:always}
  .sb-root{box-shadow:none;max-width:none}
  .sb-back{display:none}
}

/* No-JS fallback */
.noscript-warn{display:none;background:#FAB81F;color:#0A0A0A;text-align:center;padding:12px;font-size:13px;font-weight:700;border-bottom:2px solid #0A0A0A}
</style>

// ─── HELPERS ──────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function handleFor(brand, platformKey){
  return brand.handles[platformKey] || brand.slug;
}
function isActive(brand, platformKey){
  return brand.active.indexOf(platformKey) !== -1;
}

// ─── TILE RENDERERS ──────────────────────────────────────────────────
function tileHTML(brand, social){
  const active = isActive(brand, social.key);
  const handle = handleFor(brand, social.key);
  if(active){
    return `<a class="sb-tile" href="${esc(social.url(handle))}" target="_blank" rel="noopener" aria-label="${esc(social.name)} ${esc(social.handle(handle))}">
      <span class="sb-tile-icon" aria-hidden="true">${ICON[social.key]}</span>
      <span class="sb-tile-text">
        <span class="sb-tile-name">${esc(social.name)}</span>
        <span class="sb-tile-handle">${esc(social.handle(handle))}</span>
      </span>
    </a>`;
  } else {
    return `<div class="sb-tile soon" aria-label="${esc(social.name)} — yakında">
      <span class="sb-tile-icon" aria-hidden="true">${ICON[social.key]}</span>
      <span class="sb-tile-text">
        <span class="sb-tile-name">${esc(social.name)}</span>
        <span class="sb-tile-handle">SOON</span>
      </span>
    </div>`;
  }
}

function gridHTML(brand){
  return '<div class="sb-grid">' + SOCIALS.map(s => tileHTML(brand, s)).join('') + '</div>';
}

// ─── ROUTING ─────────────────────────────────────────────────────────
const HASH_MAP = {
  '': 'holding',
  'holding':'holding', 'yulalab':'holding',
  'braavolabs':'bl', 'bl':'bl',
  'burunfarki':'bf', 'bf':'bf', 'burunfark':'bf',
  'lifeos':'lo', 'lo':'lo',
};
const REVERSE_MAP = {
  'holding':'',
  'bl':'braavolabs',
  'bf':'burunfarki',
  'lo':'lifeos',
};
const TITLES = {
  'holding':'YULA Lab — Links',
  'bl':'Braavolabs — YULA Lab',
  'bf':'Burun Farkı — YULA Lab',
  'lo':'LifeOS — YULA Lab',
};

const app = document.getElementById('app');

function buildAllPages(){
  const pages = {
    holding: holdingHTML(),
    bl: brandHTML('bl'),
    bf: brandHTML('bf'),
    lo: brandHTML('lo'),
  };
  app.innerHTML = Object.keys(pages).map(key =>
    `<div id="pg-${key}" class="page" role="region" aria-label="${esc(TITLES[key])}">${pages[key]}</div>`
  ).join('');
}

function showPage(key, push){
  const el = document.getElementById('pg-' + key);
  if(!el) return;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  window.scrollTo({ top:0, behavior:'smooth' });
  if(push){
    const h = REVERSE_MAP[key];
    const url = h ? '#' + h : window.location.pathname + window.location.search;
    try { history.pushState({page:key}, '', url); } catch(e){ window.location.hash = h; }
  }
  document.title = TITLES[key] || 'YULA Lab — Links';
}

function routeFromHash(){
  const h = (window.location.hash || '').replace('#','').toLowerCase();
  showPage(HASH_MAP[h] || 'holding', false);
}

function navigate(key){ showPage(key, true); }

// ─── INIT ────────────────────────────────────────────────────────────
buildAllPages();
routeFromHash();

window.addEventListener('popstate', routeFromHash);
window.addEventListener('hashchange', routeFromHash);

// Delegated click for internal nav (data-nav attribute)
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-nav]');
  if(!t) return;
  e.preventDefault();
  const key = t.getAttribute('data-nav');
  if(HASH_MAP[key] || HASH_MAP[key.toLowerCase()]){
    navigate(HASH_MAP[key] || HASH_MAP[key.toLowerCase()]);
  }
});

// Expose for inline onclick / debugging
window.go = navigate;
})();
