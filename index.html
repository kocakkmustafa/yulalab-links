<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#F5F3EE;
  color:#0A0A0A;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a:focus-visible,button:focus-visible{outline:2px solid #0A0A0A;outline-offset:3px}

/* ─────────────────────────────────────
   STAMP layout — Direction B
   ───────────────────────────────────── */
.page{display:none;width:100%;min-height:100vh;animation:fadein .25s cubic-bezier(.4,0,.2,1)}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sb-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.sb-root{
  --bg:#F5F3EE;
  --ink:#0A0A0A;
  --ink-2:#595550;
  --ink-3:#9B958C;
  --line:rgba(10,10,10,.85);
  background:var(--bg);
  color:var(--ink);
  width:100%;
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  box-shadow:0 0 0 1px rgba(10,10,10,.06);
}

/* Top band */
.sb-band{
  background:var(--ink);
  color:var(--bg);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.sb-pad{padding:0 24px 32px}

/* Hero (holding) */
.sb-hero{padding:36px 0 20px}
.sb-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);
  display:flex;justify-content:space-between;
  margin-bottom:18px;
}
.sb-name{
  font-family:'Anton','Bebas Neue','Inter Tight',sans-serif;
  font-weight:400;
  font-size:88px;line-height:.82;
  letter-spacing:-.02em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.sb-name .sb-slash{color:var(--ink-3)}
.sb-tag{
  font-size:14px;line-height:1.5;
  color:var(--ink);max-width:280px;
  border-inline-start:3px solid var(--ink);
  padding-inline-start:12px;
}

/* Section heading */
.sb-section{
  margin:30px 0 12px;
  display:flex;align-items:center;gap:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);
}
.sb-section .sb-num{
  background:var(--ink);color:var(--bg);
  padding:3px 7px;font-weight:700;
}
.sb-section .sb-rule{flex:1;height:2px;background:var(--ink)}

/* Product grid — 2 sütun (2026-07-26: 8 üründe tek-sütun çok uzun oldu) */
.sb-prod-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
  margin-bottom:14px;
}

/* Product card */
.sb-prod{
  display:block;text-decoration:none;
  padding:22px 22px 20px;
  margin-bottom:14px;
  border:2.5px solid var(--ink);
  position:relative;
  box-shadow:5px 5px 0 var(--ink);
  transition:transform .15s,box-shadow .15s;
}
.sb-prod:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.sb-prod:active{transform:translate(0,0);box-shadow:3px 3px 0 var(--ink)}
.sb-prod-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sb-prod-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  background:var(--ink);color:var(--c);
  padding:4px 8px;
}
.sb-prod-mark{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:22px;line-height:1;
}
.sb-prod-name{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:38px;line-height:.9;
  text-transform:uppercase;
  letter-spacing:-.01em;
  margin-bottom:8px;
}
.sb-prod-sub{font-size:12.5px;line-height:1.4;opacity:.85;margin-bottom:14px}
.sb-prod-foot{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border-top:1.5px dashed currentColor;
  padding-top:10px;
  opacity:.8;
}

/* Grid içinde kompakt varyant — 2 sütunda taşma olmasın */
.sb-prod-grid .sb-prod{
  min-width:0;
  padding:14px 12px 12px;
  margin-bottom:0;
  box-shadow:3px 3px 0 var(--ink);
}
.sb-prod-grid .sb-prod:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.sb-prod-grid .sb-prod-head{margin-bottom:8px}
.sb-prod-grid .sb-prod-tag{font-size:7.5px;padding:3px 6px}
.sb-prod-grid .sb-prod-mark{font-size:16px}
.sb-prod-grid .sb-prod-name{font-size:22px;margin-bottom:5px;word-break:break-word}
.sb-prod-grid .sb-prod-sub{font-size:9.5px;line-height:1.3;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb-prod-grid .sb-prod-foot{
  flex-direction:column;align-items:flex-start;gap:3px;
  font-size:7px;letter-spacing:.08em;padding-top:8px;
}
.sb-prod-grid .sb-prod-foot span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-prod-grid .sb-prod-soon{inset-inline-end:12px;font-size:7.5px;padding:3px 6px}
@media (max-width:340px){
  .sb-prod-grid{grid-template-columns:1fr}
}

/* URL pill */
.sb-url{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 18px;
  background:var(--ink);color:var(--bg);
  text-decoration:none;
  margin-bottom:10px;
  border:2px solid var(--ink);
  transition:transform .12s;
}
.sb-url:hover{transform:translateY(-1px)}
.sb-url:active{transform:translateY(0)}
.sb-url>div{min-width:0;overflow-wrap:anywhere}
.sb-url>span{flex-shrink:0}
.sb-url-name{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:24px;line-height:1;text-transform:uppercase;
  letter-spacing:.01em;
}
.sb-url-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.12em;
  opacity:.55;margin-top:4px;
}

/* Social grid */
.sb-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border:2px solid var(--ink);
  background:var(--ink);
}
.sb-tile{
  background:var(--bg);
  color:var(--ink);
  display:flex;align-items:center;gap:12px;
  padding:14px 14px;
  min-height:64px;
  text-decoration:none;
  transition:background .15s,color .15s;
  position:relative;
  border:1px solid var(--ink);
  margin:-1px;
}
.sb-tile:hover{background:var(--ink);color:var(--bg)}
.sb-tile.soon{
  background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 8px,rgba(10,10,10,.04) 8px,rgba(10,10,10,.04) 16px);
  color:var(--ink-3);
  cursor:not-allowed;
  pointer-events:none;
}
.sb-tile.soon:hover{background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 8px,rgba(10,10,10,.04) 8px,rgba(10,10,10,.04) 16px);color:var(--ink-3)}
.sb-tile-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:18px;height:18px}
.sb-tile-text{display:flex;flex-direction:column;min-width:0;flex:1}
.sb-tile-name{
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:18px;line-height:1;
  letter-spacing:.01em;
  text-transform:uppercase;
}
.sb-tile-handle{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:.06em;
  margin-top:5px;
  opacity:.65;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sb-tile.soon .sb-tile-handle{opacity:1;font-weight:600}

/* Stats */
.sb-stats{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.sb-stat{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.1em;
  padding:5px 9px;
  background:var(--ink);color:var(--bg);
}
.sb-stat.sb-stat-line{
  background:transparent;color:var(--ink);
  border:1.5px solid var(--ink);
}

/* Bottom band */
.sb-foot{
  background:var(--ink);color:var(--bg);
  padding:12px 24px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
}
.sb-foot a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;opacity:.7}
.sb-foot a:hover{opacity:1}

/* Brand page extras */
.sb-back{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;
  border:1.5px solid var(--ink);
  padding:7px 12px;
  margin-bottom:24px;
  white-space:nowrap;
  transition:background .15s,color .15s;
  cursor:pointer;
}
.sb-back:hover{background:var(--ink);color:var(--bg)}

.sb-brandhero{padding:28px 0 22px;position:relative;display:flex;flex-direction:column;align-items:flex-start}
.sb-mark{
  display:inline-block;
  padding:8px 14px;
  margin-bottom:16px;
  font-family:'Anton','Bebas Neue',sans-serif;
  font-size:22px;
  line-height:1.05;
  background:var(--accent);
  color:var(--ink);
  border:2px solid var(--ink);
  white-space:nowrap;
}

.sb-plat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-platbtn{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border:2px solid var(--ink);
  text-decoration:none;color:var(--ink);
  background:var(--bg);
  transition:background .15s,color .15s;
}
.sb-platbtn:hover{background:var(--ink);color:var(--bg)}
.sb-platbtn.soon{
  background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 8px,rgba(10,10,10,.04) 8px,rgba(10,10,10,.04) 16px);
  color:var(--ink-3);
  cursor:not-allowed;
  pointer-events:none;
}
.sb-platbtn-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:18px;height:18px}
.sb-platbtn-text{display:flex;flex-direction:column}
.sb-platbtn-n{font-family:'Anton','Bebas Neue',sans-serif;font-size:16px;text-transform:uppercase;line-height:1}
.sb-platbtn-s{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;margin-top:3px;color:var(--ink-2)}
.sb-platbtn.soon .sb-platbtn-s{color:var(--ink-3);font-weight:600}

.sb-legal{
  margin-top:16px;padding:12px 14px;
  border:1.5px solid var(--ink);background:transparent;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;line-height:1.5;letter-spacing:.05em;
  color:var(--ink);
}
.sb-legal a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.sb-legal .sb-legal-2{opacity:.55;display:block;margin-top:4px}

/* Soon tag for brand product cards (LifeOS) */
.sb-prod-soon{
  position:absolute;top:0;inset-inline-end:22px;
  transform:translateY(-50%);
  background:var(--ink);color:var(--c);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  padding:4px 8px;
  font-weight:700;
}

/* Responsive — smaller on tiny phones */
@media (max-width:380px){
  .sb-name{font-size:72px}
  .sb-prod-name{font-size:32px}
  .sb-tile{padding:12px 10px;min-height:56px}
  .sb-tile-name{font-size:16px}
}

@media (prefers-reduced-motion:reduce){
  html:focus-within{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Print */
@media print{
  body{background:#fff}
  .page{display:block!important;page-break-after:always}
  .sb-root{box-shadow:none;max-width:none}
  .sb-back{display:none}
}

.sb-lang{background:transparent;color:inherit;border:1px solid currentColor;padding:10px 12px;min-height:44px;font:inherit;cursor:pointer}
.sb-foot{flex-wrap:wrap;gap:12px}
.sb-foot a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.sb-platbtn-s{overflow-wrap:anywhere}
/* No-JS fallback */
.noscript-warn{display:none;background:#FAB81F;color:#0A0A0A;text-align:center;padding:12px;font-size:13px;font-weight:700;border-bottom:2px solid #0A0A0A}
.noscript-links{max-width:440px;margin:0 auto;padding:24px;font:13px/1.6 'Inter',system-ui,sans-serif}
.noscript-links ul{list-style:none;margin:16px 0;padding:0}
.noscript-links li{border-top:1px solid #0A0A0A;padding:10px 0;display:flex;justify-content:space-between;gap:12px}
.noscript-links a{text-decoration:underline;text-underline-offset:2px}
.noscript-meta{font:10px/1.6 'JetBrains Mono',ui-monospace,monospace;word-break:break-all;color:#595550}
/* Locale controls and long copy must wrap rather than hide meaning. */
select{font:inherit;color:inherit}
select:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.sb-band{flex-wrap:wrap;gap:12px}
.sb-language{max-width:100%;min-width:0}
.sb-lang{max-width:100%;min-width:0;min-height:44px;background:var(--bg,#F5F3EE);color:var(--ink,#0A0A0A);font-size:12px;letter-spacing:normal;text-transform:none}
.sb-registry-status{font-size:12px;line-height:1.55;overflow-wrap:anywhere;margin:12px 0}
.sb-prod-grid .sb-prod-sub{display:block;overflow:visible;-webkit-line-clamp:unset}
.sb-prod-grid .sb-prod-foot span{overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere}
.sb-prod-tag,.sb-prod-soon,.sb-platbtn-text,.sb-back{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.sb-prod-head{gap:8px}
.sb-tile.soon .sb-tile-handle{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.sb-brandhero .sb-name{direction:ltr;unicode-bidi:isolate;text-align:start}
.sb-url-name,.sb-tile-handle{direction:ltr;unicode-bidi:isolate}
.sb-platbtn{min-width:0}.sb-platbtn-text{min-width:0}.sb-foot>span{overflow-wrap:anywhere}
html[lang="ja"]{line-break:strict}
html[lang="ja"] body{font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}
html[lang="ar"] body{font-family:Tahoma,Arial,system-ui,sans-serif}
html[lang="ar"] .sb-band,html[lang="ar"] .sb-section,html[lang="ar"] .sb-prod-tag,html[lang="ar"] .sb-prod-foot,html[lang="ar"] .sb-stat,html[lang="ar"] .sb-foot{letter-spacing:normal}
.noscript-language{margin:14px 0;border:1px solid currentColor;padding:10px}
.noscript-language summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:700}
.noscript-language summary:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.noscript-language li{flex-wrap:wrap;overflow-wrap:anywhere}
.noscript-language p{overflow-wrap:anywhere}
</style>
</head>

  if(surface.status === 'coming-soon' && !surface.url){
    return {kind:surface.kind,status:surface.status,url:null,verifiedAt:surface.verifiedAt,expiresAt:surface.expiresAt,current:currentDateWindow(surface.verifiedAt,surface.expiresAt,asOf)};
  }
  const url = safeRegistryUrl(slug, surface.kind, surface.url);
  if(!url) throw new Error(slug + ': disallowed surface URL');

}
function normaliseClaim(slug, claim, asOf){
  if(!claim || typeof claim !== 'object' || !claim.source) throw new Error(slug + ': invalid claim');
  if(!currentDateWindow(claim.verifiedAt, claim.expiresAt, asOf)) return null;
  const figures = Array.isArray(claim.figures) ? claim.figures.map(function(value){
    if(typeof value !== 'string' || !/^[~%A-Za-z0-9.+\-]{1,16}$/.test(value)) throw new Error(slug + ': invalid claim figure');
    return value;

function claimFigures(record, id){

  return claim ? claim.figures : [];
}
function percentLabel(value){

  return match ? '~' + match[1] + '%' : value;
}

  const status = record.lifecycle === 'research' ? t('research')
    : !hasCurrentSurface ? t('verificationNeeded')
    : record.lifecycle === 'beta' ? t('beta') : t('live');
  if(record.lifecycle === 'research') return [status];
  if(record.slug === 'braavolabs'){
    const primitive = claimFigures(record, 'braavolabs-primitive-count')[0];
    const provider = claimFigures(record, 'braavolabs-provider-count')[0];
    return [primitive && t('primitives') + ': ' + primitive, provider && t('providers') + ': ' + provider, status].filter(Boolean);
  }

  if(!LIFECYCLES.includes(record.lifecycle) || record.lifecycle === 'archived') throw new Error(record.slug + ': unsupported lifecycle');
  if(!canonicalDate(record.updatedAt) || record.updatedAt > asOf) throw new Error(record.slug + ': invalid updatedAt');
  if(!Array.isArray(record.surfaces) || !Array.isArray(record.claims)) throw new Error(record.slug + ': invalid registry arrays');

    .map(function(claim){ return normaliseClaim(record.slug, claim, asOf); }).filter(Boolean);

  const web = current.find(function(surface){ return surface.kind === 'web'; });
  const ios = current.find(function(surface){ return surface.kind === 'ios'; });
  const android = current.find(function(surface){ return surface.kind === 'android'; });
  const p = presentationFor(record.slug);
  const internalUrl = siteUrl('/projects/' + record.slug);
  const currentLabel = record.lifecycle === 'research' ? t('research') : (record.lifecycle === 'beta' ? t('beta') : t('live'));
  const hasCurrentSurface = record.lifecycle === 'research' || current.length > 0;
  const model = {
    key:p.key, slug:record.slug, name:record.name.trim(), sub:p.sub, tagline:p.tagline,
    color:p.color, legal:p.legal, lifecycle:record.lifecycle,
    type:p.category + ' · ' + (hasCurrentSurface ? currentLabel : t('verificationNeeded')),
    hasCurrentSurface:hasCurrentSurface,
    storeStates:{ios:storeState(surfaces,'ios'),android:storeState(surfaces,'android')},

    stores:{ios:ios ? ios.url : null,android:android ? android.url : null},

  data.products.forEach(function(record){
    if(!record || !PRESENTATION[record.slug]) return; // future products need presentation review before rendering
    if(seen.has(record.slug)) throw new Error('duplicate registry slug');
    seen.add(record.slug);

function showPage(key, push){
  const el = document.getElementById('pg-' + key);
  if(!el) return;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  if (window.__yulaReportView) window.__yulaReportView(key);

// ─── PUBLIC REGISTRY SYNC (Y-P1-005) ──────────────────────────────────
// Both the canonical response and the safe baked snapshot enter through
// normaliseRegistry/applyRegistry. There is one renderer and one trust
// boundary: a challenge page, malformed JSON, impossible date or unknown
// URL can never become an href or an asserted current status.
const REGISTRY_URL = 'https://yulalab.com/portfolio-registry.json';

function sha256Text(value){
  if(typeof crypto === 'undefined' || !crypto.subtle || typeof TextEncoder === 'undefined') return Promise.resolve(null);
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(value)).then(function(buffer){
    return Array.from(new Uint8Array(buffer)).map(function(byte){ return byte.toString(16).padStart(2,'0'); }).join('');
  });
}
function registryVerifiedAt(data){
  return data.products.map(function(product){ return product.updatedAt; }).filter(canonicalDate).sort().pop() || null;
}

// AbortSignal.timeout is a 2022 API — Safari <16 and some older in-app
// WebViews don't have it. Evaluating it unguarded inside the fetch() call
// below would throw synchronously, OUTSIDE the .then/.catch chain, which
// would abort the rest of this IIFE (breaking data-nav navigation and
// window.go for the whole page, not just the registry sync) — the exact
// opposite of the graceful-degradation this block exists for. Feature-
// detect first; on browsers without it, just skip the timeout.
const fetchOptions = { mode:'cors', credentials:'omit', cache:'no-store', referrerPolicy:'no-referrer' };
if(typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function'){
  try { fetchOptions.signal = AbortSignal.timeout(6000); } catch(e){ /* no-op — fetch proceeds without a timeout */ }
}

fetch(REGISTRY_URL, fetchOptions)
  .then(function(res){
    if(!res.ok) throw new Error('registry fetch: HTTP ' + res.status);
    const contentType = (res.headers.get('content-type') || '').toLowerCase();
    if(contentType.indexOf('application/json') === -1) throw new Error('non-JSON or attack challenge response');
    return res.text();
  })
  .then(function(raw){
    if(/^\s*</.test(raw) || /vercel.*(?:attack|challenge)/i.test(raw)) throw new Error('attack challenge response');
    let data;
    try { data = JSON.parse(raw); } catch(e){ throw new Error('malformed registry JSON'); }
    return sha256Text(raw).then(function(hash){ return {data:data,hash:hash}; });
  })
  .then(function(result){
    applyRegistry(result.data, {sha256:result.hash,verifiedAt:registryVerifiedAt(result.data),source:'network'});
    registrySyncState = 'network';
    refreshPages();
  })
  .catch(function(error){
    registrySyncState = 'fallback';
    applyRegistry(FALLBACK_REGISTRY, FALLBACK_REGISTRY_META);
    refreshPages();
  });

// ─── ATTRIBUTION (Y-P0-004) ───────────────────────────────────────────
// The links hub and the main site share ONE event contract, posted to
// yulalab.com/api/events. Two independent analytics vocabularies is how a
// funnel ends up with a product-view count that cannot be reconciled with
// its outbound count.
//
// Everything below is written to fail silently. This hub's entire job is
// to forward people to products; an analytics error must never cost a
// click. Every branch is wrapped, sendBeacon is feature-detected, and no
// handler ever calls preventDefault on an outbound link.
(function(){
  // Off by default, mirroring the main site's NEXT_PUBLIC_ATTRIBUTION_ENABLED.
  // No attribution database is provisioned yet, so /api/events answers 503
  // for every post; sending beacons at it would be a guaranteed-failing
  // request on every outbound click. Flip to true in the same change that
  // provisions storage, so the two surfaces switch on together.
  var ENABLED = false;
  var ENDPOINT = 'https://yulalab.com/api/events';
  // Hash keys are this file's own shorthand; the event contract speaks
  // registry slugs. Mapping here (rather than renaming the routes) keeps
  // existing short links working.
  var SLUG = { lo:'lifeos', bl:'braavolabs', bf:'burunfarki', lissom:'lissom',
               jablab:'jablab', gravita:'gravita', ostinato:'ostinato', choreia:'choreia' };
  var UTM_OK = /^[A-Za-z0-9_\-.]{1,64}$/;
  var SESSION_KEY = 'yula.session', UTM_KEY = 'yula.utm';

  function token(){
    try {
      var b = new Uint8Array(16);
      crypto.getRandomValues(b);
      return Array.prototype.map.call(b, function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
    } catch(e){ return null; }
  }
  function session(){
    try {
      var v = sessionStorage.getItem(SESSION_KEY);
      if(v && /^[a-f0-9]{32}$/.test(v)) return v;
      var t = token();
      if(t) sessionStorage.setItem(SESSION_KEY, t);
      return t;
    } catch(e){ return token(); }
  }
  function utm(){
    try {
      var q = new URLSearchParams(window.location.search), out = {}, found = false;
      [['utm_source','source'],['utm_medium','medium'],['utm_campaign','campaign'],['utm_content','content']]
        .forEach(function(pair){
          var v = q.get(pair[0]);
          if(v && UTM_OK.test(v)){ out[pair[1]] = v; found = true; }
        });
      if(found){ sessionStorage.setItem(UTM_KEY, JSON.stringify(out)); return out; }
      var stored = sessionStorage.getItem(UTM_KEY);
      return stored ? JSON.parse(stored) : {};
    } catch(e){ return {}; }
  }
  function slugForKey(key){ return SLUG[key] || undefined; }
  function currentSlug(){
    var h = (window.location.hash || '').replace('#','').toLowerCase();
    return SLUG[HASH_MAP[h]] || SLUG[h] || undefined;
  }
  // Normalised to the registry slug, never the short link. '#lo' and
  // '#lifeos' are the same page; emitting '/lo' and '/lifeos' would split
  // one denominator into two. The 'links:' prefix keeps hub pages distinct
  // from the main site's own '/projects/lifeos'.
  function currentPage(){
    var slug = currentSlug();
    return slug ? '/links/' + slug : '/links';
  }

  function send(body){
    try {
      var json = JSON.stringify(body);
      // text/plain keeps this a CORS-simple request: no preflight, and the
      // response is ignored anyway. The route reads the raw body, so the
      // declared type is irrelevant to parsing.
      if(navigator && typeof navigator.sendBeacon === 'function'){
        navigator.sendBeacon(ENDPOINT, new Blob([json], {type:'text/plain'}));
        return;
      }
      if(typeof fetch === 'function'){
        fetch(ENDPOINT, {method:'POST', body:json, mode:'no-cors', keepalive:true}).catch(function(){});
      }
    } catch(e){ /* never surface an analytics failure to a visitor */ }
  }

  function track(event, extra){
    if(!ENABLED) return;
    var s = session();
    if(!s) return;
    var body = { v:1, event:event, locale:locale, page:currentPage(), session:s };
    var u = utm();
    ['source','medium','campaign','content'].forEach(function(k){ if(u[k]) body[k] = u[k]; });
    if(extra) Object.keys(extra).forEach(function(k){ if(extra[k] !== undefined) body[k] = extra[k]; });
    send(body);
  }

  // Hosts the funnel actually asks about. A Discord invite or a Yeşilay
  // helpline is a real link but not a step in the roadmap's 13-event
  // vocabulary; filing it as 'product_primary_cta' would inflate that
  // metric with clicks that mean something else entirely. Untracked is the
  // honest answer for anything not listed here.
  // Our own surfaces. Navigating from this hub to yulalab.com is internal
  // movement, not an outbound to a product — filing it as
  // product_primary_cta attributed the click to whichever brand page you
  // happened to be on.
  var FIRST_PARTY = ['links.yulalab.com','yulalab.com','www.yulalab.com'];
  // NOTE: a hardcoded second list, and the server derives its own allowlist
  // from the registry precisely because two lists drift. Collapsing this
  // into the fetched registry (each record's own surface hosts) belongs with
  // Y-P1-005's links-registry migration; until then a product URL change
  // silently stops hub tracking with no failing test.
  function productHosts(){
    return PRODUCT_MODELS.reduce(function(hosts, product){
      product.currentHosts.forEach(function(host){ if(hosts.indexOf(host) === -1) hosts.push(host); });
      return hosts;
    }, []);
  }
  function classify(host){
    if(FIRST_PARTY.indexOf(host) !== -1) return null;
    if(host === 'apps.apple.com' || host === 'play.google.com') return 'store';
    if(productHosts().indexOf(host) !== -1) return 'product';
    return null;
  }

  function reportOutbound(a){
    var url = new URL(a.href);
    var kind = classify(url.host);
    if(!kind) return; // not a funnel step — see classify()
    track(kind === 'store' ? 'store_outbound' : 'product_primary_cta', {
      // Origin + path only; the server strips query/fragment anyway, and
      // sending them would put data in a payload that has no business
      // carrying it.
      target: url.origin + url.pathname,
      targetCategory: kind === 'store' ? 'store' : 'web',
      product: currentSlug()
    });
  }

  // Delegated, capture-phase: runs before any other handler and, crucially,
  // before the browser starts the navigation. Never calls preventDefault.
  document.addEventListener('click', function(e){
    try {
      var a = e.target && e.target.closest ? e.target.closest('a[href^="https://"]') : null;
      if(a) reportOutbound(a);
    } catch(err){ /* a broken tracker must not break a link */ }
  }, true);

  // Middle-click opens a new tab without firing click in some browsers.
  // The main site's TrackedLink already covers this; without the same
  // handling here the two surfaces would bias the same metric differently.
  document.addEventListener('auxclick', function(e){
    try {
      if(e.button !== 1) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href^="https://"]') : null;
      if(a) reportOutbound(a);
    } catch(err){ /* same */ }
  }, true);

  // A brand page becoming visible is this hub's product_view. Called from
  // showPage() so pushState navigation counts; lastView is reset whenever a
  // non-product page is shown, otherwise lifeos -> holding -> lifeos would
  // drop the second, real visit as a duplicate.
  var lastView = null;
  window.__yulaReportView = function(key){
    try {
      var slug = slugForKey(key);
      if(!slug){ lastView = null; return; }
      if(slug === lastView) return;
      lastView = slug;
      track('product_view', { product: slug });
    } catch(err){ /* never break routing */ }
  };
  window.addEventListener('popstate', function(){ window.__yulaReportView(HASH_MAP[(window.location.hash||'').replace('#','').toLowerCase()] || 'holding'); });
  window.__yulaReportView(HASH_MAP[(window.location.hash||'').replace('#','').toLowerCase()] || 'holding');
})();
})();
</script>
</body>
</html>
